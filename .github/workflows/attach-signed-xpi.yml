name: Attach signed XPI (listed)

# Downloads the AMO-signed (listed-channel) .xpi for an already-submitted release from the AMO API
# and attaches it to the GitHub release, so people can install it permanently in normal Firefox
# (the plain -firefox.zip is an UNSIGNED build and only loads as a temporary add-on Firefox wipes
# on restart). amo-submit.yml submits the version; this fetches the signed artifact once Mozilla
# has approved it. Re-runnable per tag, so it also backfills older releases (v0.27/v0.28/...).
#
# It does NOT use `web-ext sign` (that only creates new submissions and conflicts with "Version X
# already exists" on an already-submitted version). It reads the signed file via the AMO REST API.

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to fetch the signed xpi for (e.g. v0.29.0)"
                required: true

permissions:
    contents: write

concurrency:
    group: amo-submit
    cancel-in-progress: false

jobs:
    attach-signed-xpi:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: amo
        env:
            TAG: ${{ inputs.tag }}
        steps:
            - name: Check out (for the fetch script)
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Download the Firefox zip from the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir -p firefox-mv3
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-firefox.zip' --output firefox.zip
                  unzip -q firefox.zip -d firefox-mv3

            - name: Resolve the add-on id from the built manifest
              id: addon
              run: |
                  GUID=$(node -e "console.log(require('./firefox-mv3/manifest.json').browser_specific_settings.gecko.id)")
                  echo "guid=$GUID" >> "$GITHUB_OUTPUT"
                  echo "Add-on guid: $GUID"

            - name: Fetch the signed xpi from AMO
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
                  ADDON_GUID: ${{ steps.addon.outputs.guid }}
                  VERSION: ${{ inputs.tag }}
                  OUT_DIR: amo-artifacts
              run: node .github/scripts/fetch-amo-signed-xpi.mjs

            - name: Attach the signed xpi to the release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if compgen -G "amo-artifacts/*.xpi" > /dev/null; then
                    gh release upload "$TAG" amo-artifacts/*.xpi --clobber
                    echo "Signed xpi attached to $TAG - installable permanently in Firefox."
                  else
                    echo "No signed xpi downloaded. The version is probably still in AMO review - re-run once it is approved."
                    exit 1
                  fi
