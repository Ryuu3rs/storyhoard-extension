name: Release Please

# Single release path. On every push to main, release-please maintains a
# "Release PR" that bumps the version and CHANGELOG from conventional commits.
# When that PR merges, a release is created and the release-please job builds,
# checksums, and uploads the extension artifacts to it. Packaging lives here
# rather than in a separate tag-triggered workflow because tags pushed by
# GITHUB_TOKEN do not trigger other workflows.
#
# AMO submission lives in its own workflow (amo-submit.yml), triggered when the
# release is published. Keeping it out of this workflow means its AMO wait runs
# in a separate concurrency lane and can never block the next Release Please run.

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release-please-main-v2
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        env:
            # Baked into the release build so the shipped extension can reach the community
            # server. _ORIGIN adds the host permission (wxt.config), _URL is the fetch base
            # (community.ts). Without _URL the build shipped an empty base and every request
            # became a relative fetch -> "NetworkError when attempting to fetch resource".
            VITE_COMMUNITY_API_ORIGIN: ${{ vars.VITE_COMMUNITY_API_ORIGIN }}
            VITE_COMMUNITY_API_URL: ${{ vars.VITE_COMMUNITY_API_URL }}
            # Usage-analytics ingest base (analytics-usage.ts). Points at weeb.ltd, which is
            # already a host permission, so no _ORIGIN is needed. Unset -> the client no-ops.
            VITE_ANALYTICS_API_URL: ${{ vars.VITE_ANALYTICS_API_URL }}
        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            - name: Checkout
              if: ${{ steps.release.outputs.release_created }}
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.release.outputs.tag_name }}

            - name: Version/tag check
              if: ${{ steps.release.outputs.release_created }}
              shell: bash
              run: |
                  PKG_VERSION=$(node -p "require('./apps/extension/package.json').version")
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  TAG="${{ steps.release.outputs.tag_name }}"
                  STRIPPED="${TAG#v}"
                  if [ "$PKG_VERSION" != "$STRIPPED" ]; then
                    echo "::error::Version mismatch: apps/extension/package.json=$PKG_VERSION tag=$TAG"
                    exit 1
                  fi
                  if [ "$ROOT_VERSION" != "$STRIPPED" ]; then
                    echo "::error::Version mismatch: package.json=$ROOT_VERSION tag=$TAG - bump root package.json too"
                    exit 1
                  fi
                  echo "Version check passed: $PKG_VERSION"

            - name: Setup Node.js
              if: ${{ steps.release.outputs.release_created }}
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Use npm 11
              if: ${{ steps.release.outputs.release_created }}
              run: npm install -g npm@11

            - name: Install
              if: ${{ steps.release.outputs.release_created }}
              run: npm install

            - name: Validate
              if: ${{ steps.release.outputs.release_created }}
              run: npm run check

            - name: Package Chromium
              if: ${{ steps.release.outputs.release_created }}
              run: npm run zip

            - name: Package Firefox
              if: ${{ steps.release.outputs.release_created }}
              run: npm run zip:firefox

            - name: Manifest smoke gate
              if: ${{ steps.release.outputs.release_created }}
              run: npm run test:manifest --workspace @amr/browser-tests

            - name: Generate checksums
              if: ${{ steps.release.outputs.release_created }}
              shell: bash
              run: |
                  cd apps/extension/.output
                  sha256sum *.zip > SHA256SUMS.txt

            - name: Upload release assets
              if: ${{ steps.release.outputs.release_created }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag_name }}
              run: |
                  files=(apps/extension/.output/*.zip apps/extension/.output/SHA256SUMS.txt)
                  gh release upload "$TAG" "${files[@]}" --clobber
